name: Deploy Staging

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  BUN_VERSION: 'latest'

jobs:
  # ============================================
  # Deploy to Staging (Vercel + Railway)
  # ============================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      # --- Deploy Web to Vercel ---
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Web to Vercel (Staging)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd apps/web
          vercel --token ${{ secrets.VERCEL_TOKEN }} --yes

      # --- Deploy API to Railway ---
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd apps/api
          railway up --service perpus-api-staging

      # --- Run Migrations (Railway) ---
      - name: Run DB Migrations (Staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd packages/prisma-client
          bunx prisma migrate deploy

      # --- Smoke Test ---
      - name: Smoke Test (Staging)
        run: |
          echo "Waiting for deployment..."
          sleep 30
          curl -f https://perpus-api-staging.up.railway.app/health || exit 1
          echo "✅ Staging health check passed"