# Docker Compose for PERPUS (Development)

services:
  postgres:
    image: postgres:16
    container_name: perpus-postgres
    environment:
      POSTGRES_DB: perpus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perpus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: perpus-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/perpus_db?schema=public
      JWT_SECRET: pinjamanbuku_jwt_secret_key_2024
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: development
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages:/app/packages

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: perpus-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web/src:/app/apps/web/src
      - ../apps/web/public:/app/apps/web/public
      - ../packages:/app/packages

volumes:
  postgres_data: